# ============================================================
# CareerPath AI — Render Blueprint Deployment Specification
# Dual-Engine Architecture: Persistent Real-Time & Worker Service
# ============================================================

services:
  - type: web
    name: careerpath-ai-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Render automatically assigns PORT dynamically.
      # The server code automatically reads process.env.PORT.
      - key: PORT
        value: 10000

      - key: SERVER_ROLE
        value: realtime-worker

      - key: JWT_EXPIRES_IN
        value: 7d

      # Sensitive credentials must be configured securely in the Render dashboard:
      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      # Set this to your deployed Vercel frontend URL, e.g. https://careerpath-ai.vercel.app
      - key: CLIENT_URL
        value: https://careerpath-ai.vercel.app
