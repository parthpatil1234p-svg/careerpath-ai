<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Card Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradLight)" />

  <!-- Architectural Grid Lines -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="640" x2="1200" y2="640" />
    <line x1="240" y1="0" x2="240" y2="800" />
    <line x1="480" y1="0" x2="480" y2="800" />
    <line x1="720" y1="0" x2="720" y2="800" />
    <line x1="960" y1="0" x2="960" y2="800" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 48)">
    <rect width="216" height="32" rx="16" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4.5" fill="#EF4444" />
    <text x="32" y="21" fill="#DC2626" font-size="12" font-weight="700" class="font-mono">STAGE 1 : RAW ASSESSMENT</text>
    
    <text x="0" y="78" fill="#0F172A" font-size="32" font-weight="800" class="font-sans">Current Skills &amp; Critical Gaps</text>
    <text x="0" y="108" fill="#475569" font-size="15" class="font-sans">Uncalibrated student baseline with fragmented tutorials and missing core competencies.</text>
  </g>

  <!-- Left Main Card: Student Profile & Fragmented Skills -->
  <g transform="translate(60, 185)" filter="url(#cardShadow)">
    <rect width="510" height="545" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Card Header -->
    <text x="32" y="44" fill="#0F172A" font-size="19" font-weight="700" class="font-sans">Student Self-Reported Skills</text>
    <text x="32" y="68" fill="#64748B" font-size="12" font-weight="600" class="font-mono">TARGETING: SOFTWARE ENGINEER (FULL STACK)</text>

    <!-- Skill Chips -->
    <g transform="translate(32, 92)">
      <!-- HTML5 / CSS3 -->
      <rect width="134" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="14" y="23" fill="#334155" font-size="13" font-weight="600" class="font-sans">HTML5 / CSS3</text>
      <circle cx="118" cy="18" r="4" fill="#10B981" />

      <!-- JavaScript -->
      <rect x="146" width="168" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="160" y="23" fill="#334155" font-size="13" font-weight="600" class="font-sans">JavaScript (Basic)</text>
      <circle cx="298" cy="18" r="4" fill="#F59E0B" />

      <!-- Git -->
      <rect x="324" width="118" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="340" y="23" fill="#334155" font-size="13" font-weight="600" class="font-sans">Git (Basic)</text>
      <circle cx="426" cy="18" r="4" fill="#F59E0B" />
    </g>

    <!-- Critical Gaps Header -->
    <text x="32" y="174" fill="#DC2626" font-size="14" font-weight="700" class="font-sans">Detected Industry Skill Gaps (High Severity):</text>

    <!-- Missing Skill List -->
    <g transform="translate(32, 194)">
      <!-- Gap 1 -->
      <g transform="translate(0, 0)">
        <rect width="446" height="52" rx="10" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1" />
        <circle cx="26" cy="26" r="11" fill="#FEE2E2" />
        <text x="21" y="30" fill="#EF4444" font-size="13" font-weight="800" class="font-mono">✕</text>
        <text x="48" y="26" fill="#991B1B" font-size="14" font-weight="700" class="font-sans">RESTful API Design &amp; Architecture</text>
        <text x="48" y="42" fill="#64748B" font-size="12" class="font-sans">Missing: Express.js, HTTP status codes, middleware routing</text>
      </g>

      <!-- Gap 2 -->
      <g transform="translate(0, 64)">
        <rect width="446" height="52" rx="10" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1" />
        <circle cx="26" cy="26" r="11" fill="#FEE2E2" />
        <text x="21" y="30" fill="#EF4444" font-size="13" font-weight="800" class="font-mono">✕</text>
        <text x="48" y="26" fill="#991B1B" font-size="14" font-weight="700" class="font-sans">Database Modeling &amp; Persistence</text>
        <text x="48" y="42" fill="#64748B" font-size="12" class="font-sans">Missing: MongoDB schema design, indexing, Mongoose ORM</text>
      </g>

      <!-- Gap 3 -->
      <g transform="translate(0, 128)">
        <rect width="446" height="52" rx="10" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1" />
        <circle cx="26" cy="26" r="11" fill="#FEE2E2" />
        <text x="21" y="30" fill="#EF4444" font-size="13" font-weight="800" class="font-mono">✕</text>
        <text x="48" y="26" fill="#991B1B" font-size="14" font-weight="700" class="font-sans">Production Cloud Deployment</text>
        <text x="48" y="42" fill="#64748B" font-size="12" class="font-sans">Missing: Render / Vercel deployment, CORS security, env config</text>
      </g>

      <!-- Gap 4 -->
      <g transform="translate(0, 192)">
        <rect width="446" height="52" rx="10" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1" />
        <circle cx="26" cy="26" r="11" fill="#FEE2E2" />
        <text x="21" y="30" fill="#EF4444" font-size="13" font-weight="800" class="font-mono">✕</text>
        <text x="48" y="26" fill="#991B1B" font-size="14" font-weight="700" class="font-sans">Automated Testing &amp; CI/CD</text>
        <text x="48" y="42" fill="#64748B" font-size="12" class="font-sans">Missing: GitHub Actions, unit testing, lint verification</text>
      </g>
    </g>

    <!-- Status Warning Footer -->
    <rect x="32" y="482" width="446" height="36" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
    <text x="48" y="505" fill="#B45309" font-size="12" font-weight="600" class="font-sans">⚠️ Warning: High rejection probability for production tech roles.</text>
  </g>

  <!-- Right Side Card: The Dilemma & Low Match Score -->
  <g transform="translate(605, 185)" filter="url(#cardShadow)">
    <rect width="535" height="545" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <text x="35" y="44" fill="#0F172A" font-size="19" font-weight="700" class="font-sans">Market Alignment Telemetry</text>
    
    <!-- Score Dial Box -->
    <g transform="translate(35, 75)">
      <rect width="465" height="142" rx="12" fill="#F8FAFC" stroke="#FECDD3" stroke-width="1.2" />
      
      <circle cx="85" cy="71" r="48" fill="none" stroke="#E2E8F0" stroke-width="9" />
      <circle cx="85" cy="71" r="48" fill="none" stroke="#EF4444" stroke-width="9" stroke-dasharray="301" stroke-dashoffset="195" stroke-linecap="round" />
      <text x="85" y="78" fill="#DC2626" font-size="24" font-weight="800" text-anchor="middle" class="font-mono">35%</text>
      
      <text x="156" y="50" fill="#0F172A" font-size="16" font-weight="700" class="font-sans">Low Industry Readiness Score</text>
      <text x="156" y="74" fill="#64748B" font-size="12" class="font-sans">Student matches basic frontend syntax but lacks</text>
      <text x="156" y="92" fill="#64748B" font-size="12" class="font-sans">full-stack data handling and deployment capabilities.</text>
      
      <rect x="156" y="104" width="138" height="24" rx="6" fill="#FEE2E2" />
      <text x="166" y="120" fill="#DC2626" font-size="11" font-weight="700" class="font-mono">STATUS: UNPREPARED</text>
    </g>

    <!-- Tutorial Hell Dilemma -->
    <g transform="translate(35, 246)">
      <text x="0" y="20" fill="#0F172A" font-size="15" font-weight="700" class="font-sans">The "Tutorial Hell" Bottleneck:</text>
      
      <rect x="0" y="34" width="465" height="68" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="20" y="58" fill="#1E293B" font-size="13" font-weight="500" class="font-sans">📺 Watching endless 40-hour video playlists without building.</text>
      <text x="20" y="80" fill="#DC2626" font-size="12" font-weight="600" class="font-sans">❌ Result: No proof of work, zero deployable portfolio projects.</text>
      
      <rect x="0" y="116" width="465" height="68" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="20" y="140" fill="#1E293B" font-size="13" font-weight="500" class="font-sans">❓ No structured weekly milestones or verified documentation.</text>
      <text x="20" y="162" fill="#DC2626" font-size="12" font-weight="600" class="font-sans">❌ Result: Overwhelmed by fragmented, contradictory tutorials.</text>
    </g>

    <!-- Bottom Indicator -->
    <g transform="translate(35, 488)">
      <rect width="465" height="34" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
      <text x="20" y="22" fill="#4F46E5" font-size="12" font-weight="700" class="font-mono">⚡ DRAG SLIDER TO DISSOLVE &amp; REVEAL THE AI ROADMAP ➔</text>
    </g>
  </g>
</svg>
