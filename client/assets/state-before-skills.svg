<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="640" x2="1200" y2="640" />
    <line x1="240" y1="0" x2="240" y2="800" />
    <line x1="480" y1="0" x2="480" y2="800" />
    <line x1="720" y1="0" x2="720" y2="800" />
    <line x1="960" y1="0" x2="960" y2="800" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 50)">
    <rect width="210" height="34" rx="17" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#ef4444" />
    <text x="36" y="22" fill="#fca5a5" font-size="13" font-weight="700" class="font-mono">STAGE 1 : RAW ASSESSMENT</text>
    
    <text x="0" y="80" fill="#ffffff" font-size="34" font-weight="800" class="font-sans">Current Skills &amp; Critical Gaps</text>
    <text x="0" y="112" fill="#94a3b8" font-size="16" class="font-sans">Uncalibrated student baseline with fragmented tutorials and missing core competencies.</text>
  </g>

  <!-- Left Main Card: Student Profile & Fragmented Skills -->
  <g transform="translate(60, 200)">
    <rect width="500" height="530" rx="16" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" />
    
    <!-- Card Header -->
    <text x="30" y="45" fill="#ffffff" font-size="20" font-weight="700" class="font-sans">Student Self-Reported Skills</text>
    <text x="30" y="70" fill="#64748b" font-size="13" class="font-mono">TARGETING: SOFTWARE ENGINEER</text>

    <!-- Skill Chips -->
    <g transform="translate(30, 95)">
      <!-- HTML5 -->
      <rect width="130" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="16" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">HTML5 / CSS3</text>
      <circle cx="112" cy="19" r="4" fill="#10b981" />

      <!-- JavaScript -->
      <rect x="145" width="170" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="160" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">JavaScript (Basic)</text>
      <circle cx="298" cy="19" r="4" fill="#f59e0b" />

      <!-- Git -->
      <rect x="330" width="105" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="348" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Git (Basic)</text>
      <circle cx="418" cy="19" r="4" fill="#f59e0b" />
    </g>

    <!-- Critical Gaps Header -->
    <text x="30" y="185" fill="#f87171" font-size="15" font-weight="700" class="font-sans">Detected Industry Skill Gaps (High Severity):</text>

    <!-- Missing Skill List -->
    <g transform="translate(30, 210)">
      <!-- Gap 1 -->
      <g transform="translate(0, 0)">
        <rect width="440" height="52" rx="10" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.3)" />
        <circle cx="26" cy="26" r="10" fill="#ef4444" opacity="0.2" />
        <text x="22" y="30" fill="#ef4444" font-size="12" font-weight="800" class="font-mono">✕</text>
        <text x="48" y="27" fill="#ffffff" font-size="14" font-weight="600" class="font-sans">RESTful API Design &amp; Architecture</text>
        <text x="48" y="42" fill="#94a3b8" font-size="11" class="font-sans">Missing: Express.js, HTTP status codes, middleware routing</text>
      </g>

      <!-- Gap 2 -->
      <g transform="translate(0, 64)">
        <rect width="440" height="52" rx="10" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.3)" />
        <circle cx="26" cy="26" r="10" fill="#ef4444" opacity="0.2" />
        <text x="22" y="30" fill="#ef4444" font-size="12" font-weight="800" class="font-mono">✕</text>
        <text x="48" y="27" fill="#ffffff" font-size="14" font-weight="600" class="font-sans">Database Modeling &amp; Persistence</text>
        <text x="48" y="42" fill="#94a3b8" font-size="11" class="font-sans">Missing: MongoDB schema design, indexing, Mongoose ORM</text>
      </g>

      <!-- Gap 3 -->
      <g transform="translate(0, 128)">
        <rect width="440" height="52" rx="10" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.3)" />
        <circle cx="26" cy="26" r="10" fill="#ef4444" opacity="0.2" />
        <text x="22" y="30" fill="#ef4444" font-size="12" font-weight="800" class="font-mono">✕</text>
        <text x="48" y="27" fill="#ffffff" font-size="14" font-weight="600" class="font-sans">Production Cloud Deployment</text>
        <text x="48" y="42" fill="#94a3b8" font-size="11" class="font-sans">Missing: Render / Vercel deployment, CORS security, env config</text>
      </g>

      <!-- Gap 4 -->
      <g transform="translate(0, 192)">
        <rect width="440" height="52" rx="10" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.3)" />
        <circle cx="26" cy="26" r="10" fill="#ef4444" opacity="0.2" />
        <text x="22" y="30" fill="#ef4444" font-size="12" font-weight="800" class="font-mono">✕</text>
        <text x="48" y="27" fill="#ffffff" font-size="14" font-weight="600" class="font-sans">Automated Testing &amp; CI/CD</text>
        <text x="48" y="42" fill="#94a3b8" font-size="11" class="font-sans">Missing: GitHub Actions, unit testing, lint verification</text>
      </g>
    </g>

    <!-- Status Warning Footer -->
    <rect x="30" y="475" width="440" height="34" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
    <text x="45" y="497" fill="#fbbf24" font-size="12" font-weight="600" class="font-sans">⚠️ Warning: High rejection probability for production tech roles.</text>
  </g>

  <!-- Right Side Card: The Dilemma & Low Match Score -->
  <g transform="translate(600, 200)">
    <rect width="540" height="530" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
    
    <text x="35" y="45" fill="#ffffff" font-size="20" font-weight="700" class="font-sans">Market Alignment Telemetry</text>
    
    <!-- Score Dial Box -->
    <g transform="translate(35, 75)">
      <rect width="470" height="150" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(239, 68, 68, 0.25)" />
      
      <circle cx="90" cy="75" r="50" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10" />
      <circle cx="90" cy="75" r="50" fill="none" stroke="#ef4444" stroke-width="10" stroke-dasharray="314" stroke-dashoffset="205" stroke-linecap="round" />
      <text x="90" y="82" fill="#ef4444" font-size="24" font-weight="800" text-anchor="middle" class="font-sans">35%</text>
      
      <text x="165" y="55" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">Low Industry Readiness Score</text>
      <text x="165" y="80" fill="#94a3b8" font-size="13" class="font-sans">Student matches basic frontend syntax but lacks full-stack data handling and deployment capabilities.</text>
      
      <rect x="165" y="98" width="125" height="26" rx="6" fill="#ef4444" opacity="0.2" />
      <text x="175" y="115" fill="#fca5a5" font-size="11" font-weight="700" class="font-mono">STATUS: UNPREPARED</text>
    </g>

    <!-- Tutorial Hell Dilemma -->
    <g transform="translate(35, 250)">
      <text x="0" y="20" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">The "Tutorial Hell" Pattern:</text>
      
      <rect x="0" y="35" width="470" height="70" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" />
      <text x="20" y="62" fill="#cbd5e1" font-size="13" class="font-sans">📺 Watching endless 40-hour video playlists without building.</text>
      <text x="20" y="86" fill="#94a3b8" font-size="12" class="font-sans">❌ Result: No proof of work, zero deployable portfolio projects.</text>
      
      <rect x="0" y="120" width="470" height="70" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" />
      <text x="20" y="147" fill="#cbd5e1" font-size="13" class="font-sans">❓ No structured weekly accountability or feedback loop.</text>
      <text x="20" y="171" fill="#94a3b8" font-size="12" class="font-sans">❌ Result: Overwhelmed by inconsistent online roadmaps.</text>
    </g>

    <!-- Bottom Indicator -->
    <g transform="translate(35, 475)">
      <text x="0" y="20" fill="#38bdf8" font-size="13" font-weight="600" class="font-mono">⚡ SCROLL DOWN TO DISSOLVE &amp; REVEAL THE AI ROADMAP ➔</text>
    </g>
  </g>
</svg>
