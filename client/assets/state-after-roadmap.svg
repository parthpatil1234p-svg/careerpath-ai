<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradLight2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Indigo to Blue Gradient -->
    <linearGradient id="indigoBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Card Shadow Filter -->
    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradLight2)" />

  <!-- Architectural Grid Lines -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="640" x2="1200" y2="640" />
    <line x1="240" y1="0" x2="240" y2="800" />
    <line x1="480" y1="0" x2="480" y2="800" />
    <line x1="720" y1="0" x2="720" y2="800" />
    <line x1="960" y1="0" x2="960" y2="800" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 48)">
    <rect width="230" height="32" rx="16" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4.5" fill="#4F46E5" />
    <text x="32" y="21" fill="#4338CA" font-size="12" font-weight="700" class="font-mono">STAGE 2 : REVEALED ROADMAP</text>
    
    <text x="0" y="78" fill="#0F172A" font-size="32" font-weight="800" class="font-sans">Target Career Atlas &amp; Action Plan</text>
    <text x="0" y="108" fill="#475569" font-size="15" class="font-sans">Deterministic gap-closing roadmap with weekly milestone deliverables and verified resources.</text>
  </g>

  <!-- Left Main Card: 8-Week Step-by-Step Curriculum -->
  <g transform="translate(60, 185)" filter="url(#cardShadow2)">
    <rect width="525" height="545" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <text x="32" y="44" fill="#0F172A" font-size="19" font-weight="700" class="font-sans">Personalized Execution Curriculum</text>
    <text x="32" y="68" fill="#4F46E5" font-size="12" font-weight="600" class="font-mono">FULL-STACK DEVELOPER · 8-WEEK TRACK</text>

    <!-- Weekly Modules -->
    <g transform="translate(32, 88)">
      <!-- Week 1 (Completed) -->
      <g transform="translate(0, 0)">
        <rect width="461" height="84" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2" />
        <circle cx="32" cy="42" r="15" fill="#D1FAE5" />
        <text x="25" y="48" fill="#059669" font-size="15" font-weight="800" class="font-mono">✓</text>
        
        <text x="62" y="30" fill="#0F172A" font-size="15" font-weight="700" class="font-sans">Week 1: Modern JS &amp; Async Architecture</text>
        <text x="62" y="50" fill="#475569" font-size="12" class="font-sans">Mastered closures, promises, DOM events, and modular ES6 patterns.</text>
        
        <rect x="62" y="58" width="128" height="19" rx="4" fill="#D1FAE5" />
        <text x="69" y="72" fill="#065F46" font-size="10" font-weight="700" class="font-mono">PROJECT DELIVERED</text>
        
        <text x="415" y="46" fill="#059669" font-size="12" font-weight="700" class="font-mono">100%</text>
      </g>

      <!-- Week 2 (Active In Progress) -->
      <g transform="translate(0, 94)">
        <rect width="461" height="84" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5" />
        <circle cx="32" cy="42" r="15" fill="#E0E7FF" />
        <circle cx="32" cy="42" r="6" fill="#4F46E5" />
        
        <text x="62" y="30" fill="#0F172A" font-size="15" font-weight="700" class="font-sans">Week 2: RESTful Express &amp; JWT Security</text>
        <text x="62" y="50" fill="#475569" font-size="12" class="font-sans">Building authenticated CRUD endpoints, rate limiting, and input validation.</text>
        
        <rect x="62" y="58" width="112" height="19" rx="4" fill="#E0E7FF" />
        <text x="69" y="72" fill="#3730A3" font-size="10" font-weight="700" class="font-mono">ACTIVE MODULE</text>

        <text x="420" y="46" fill="#4F46E5" font-size="12" font-weight="700" class="font-mono">75%</text>
      </g>

      <!-- Week 3 (Upcoming) -->
      <g transform="translate(0, 188)">
        <rect width="461" height="84" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="32" cy="42" r="15" fill="#F1F5F9" />
        <text x="28" y="47" fill="#64748B" font-size="13" font-weight="700" class="font-mono">3</text>
        
        <text x="62" y="30" fill="#334155" font-size="15" font-weight="700" class="font-sans">Week 3: Database Persistence (MongoDB Atlas)</text>
        <text x="62" y="50" fill="#64748B" font-size="12" class="font-sans">Schema modeling, indexing, aggregation pipelines, and ACID transactions.</text>
        
        <rect x="62" y="58" width="82" height="19" rx="4" fill="#F1F5F9" />
        <text x="69" y="72" fill="#64748B" font-size="10" font-weight="700" class="font-mono">UPCOMING</text>
        
        <text x="425" y="46" fill="#94A3B8" font-size="12" font-weight="700" class="font-mono">0%</text>
      </g>

      <!-- Week 4 (Upcoming) -->
      <g transform="translate(0, 282)">
        <rect width="461" height="84" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="32" cy="42" r="15" fill="#F1F5F9" />
        <text x="28" y="47" fill="#64748B" font-size="13" font-weight="700" class="font-mono">4</text>
        
        <text x="62" y="30" fill="#334155" font-size="15" font-weight="700" class="font-sans">Week 4: Cloud Deployment &amp; GitHub CI/CD</text>
        <text x="62" y="50" fill="#64748B" font-size="12" class="font-sans">Automated testing, Render production build, CORS headers, domain mapping.</text>
        
        <rect x="62" y="58" width="82" height="19" rx="4" fill="#F1F5F9" />
        <text x="69" y="72" fill="#64748B" font-size="10" font-weight="700" class="font-mono">UPCOMING</text>

        <text x="425" y="46" fill="#94A3B8" font-size="12" font-weight="700" class="font-mono">0%</text>
      </g>
    </g>

    <!-- Bottom Roadmap Progress Meter -->
    <g transform="translate(32, 474)">
      <text x="0" y="15" fill="#475569" font-size="12" font-weight="600" class="font-sans">Overall Roadmap Completion</text>
      <text x="461" y="15" fill="#4F46E5" font-size="12" font-weight="700" text-anchor="end" class="font-mono">45% Complete</text>
      <rect y="24" width="461" height="8" rx="4" fill="#E2E8F0" />
      <rect y="24" width="207" height="8" rx="4" fill="url(#indigoBlueGrad)" />
    </g>
  </g>

  <!-- Right Side Card: Calibrated Match Score & Career Atlas Telemetry -->
  <g transform="translate(620, 185)" filter="url(#cardShadow2)">
    <rect width="520" height="545" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <text x="35" y="44" fill="#0F172A" font-size="19" font-weight="700" class="font-sans">Calibrated Career Atlas Score</text>
    
    <!-- Score Dial Box -->
    <g transform="translate(35, 75)">
      <rect width="450" height="142" rx="12" fill="#F8FAFC" stroke="#C7D2FE" stroke-width="1.2" />
      
      <circle cx="85" cy="71" r="48" fill="none" stroke="#E2E8F0" stroke-width="9" />
      <circle cx="85" cy="71" r="48" fill="none" stroke="#4F46E5" stroke-width="9" stroke-dasharray="301" stroke-dashoffset="36" stroke-linecap="round" />
      <text x="85" y="79" fill="#4F46E5" font-size="25" font-weight="800" text-anchor="middle" class="font-mono">88%</text>
      
      <text x="156" y="50" fill="#0F172A" font-size="17" font-weight="700" class="font-sans">Full-Stack Developer</text>
      <text x="156" y="72" fill="#64748B" font-size="12" class="font-sans">Calculated via deterministic weighted matching:</text>
      <text x="156" y="90" fill="#64748B" font-size="12" class="font-sans">60% skills + 25% interests + 15% academics.</text>
      
      <rect x="156" y="104" width="145" height="24" rx="6" fill="#ECFDF5" />
      <text x="166" y="120" fill="#059669" font-size="11" font-weight="700" class="font-mono">STATUS: OPTIMAL FIT</text>
    </g>

    <!-- Placement Readiness Index (PRI) -->
    <g transform="translate(35, 246)">
      <text x="0" y="20" fill="#0F172A" font-size="15" font-weight="700" class="font-sans">Placement Readiness Index (PRI):</text>
      
      <rect x="0" y="34" width="450" height="88" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="20" y="60" fill="#0F172A" font-size="14" font-weight="700" class="font-sans">🎯 92 / 100 — High Employability Target</text>
      <text x="20" y="82" fill="#64748B" font-size="12" class="font-sans">Every milestone is paired with verified documentation (MDN, Node docs, MongoDB).</text>
      <text x="20" y="102" fill="#2563EB" font-size="12" font-weight="600" class="font-sans">Deliverable: Deployable production portfolio repository.</text>
    </g>

    <!-- AI Career Mentor Integration -->
    <g transform="translate(35, 376)">
      <rect width="450" height="84" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
      <circle cx="35" cy="42" r="16" fill="#E0E7FF" />
      <text x="27" y="47" fill="#4F46E5" font-size="16">🤖</text>
      <text x="65" y="34" fill="#0F172A" font-size="14" font-weight="700" class="font-sans">24/7 AI Mentor Contextual Guidance</text>
      <text x="65" y="54" fill="#475569" font-size="12" class="font-sans">Doubts solved instantly within your active roadmap module with code suggestions and concept breakdowns.</text>
    </g>

    <!-- Bottom Status -->
    <g transform="translate(35, 488)">
      <rect width="450" height="34" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
      <text x="20" y="22" fill="#059669" font-size="12" font-weight="700" class="font-mono">✓ CLEAR PATHWAY · MEASURABLE PROGRESSION</text>
    </g>
  </g>
</svg>
