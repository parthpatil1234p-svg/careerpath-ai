<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>

    <!-- Glowing Card Gradient -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(17, 24, 39, 0.85)" />
      <stop offset="100%" stop-color="rgba(11, 17, 32, 0.95)" />
    </linearGradient>

    <linearGradient id="neonCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filters for Radiant Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad2)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="150" r="140" fill="#00f2fe" opacity="0.08" filter="url(#cyanGlow)" />
  <circle cx="1050" cy="650" r="160" fill="#8b5cf6" opacity="0.08" filter="url(#cyanGlow)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(0, 242, 254, 0.05)" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="640" x2="1200" y2="640" />
    <line x1="240" y1="0" x2="240" y2="800" />
    <line x1="480" y1="0" x2="480" y2="800" />
    <line x1="720" y1="0" x2="720" y2="800" />
    <line x1="960" y1="0" x2="960" y2="800" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 50)">
    <rect width="250" height="34" rx="17" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#00f2fe" />
    <text x="36" y="22" fill="#38bdf8" font-size="13" font-weight="700" class="font-mono">STAGE 2 : REVEALED ROADMAP</text>
    
    <text x="0" y="80" fill="#ffffff" font-size="34" font-weight="800" class="font-sans">Target Career Atlas &amp; Action Plan</text>
    <text x="0" y="112" fill="#94a3b8" font-size="16" class="font-sans">Deterministic gap-closing roadmap with weekly milestone deliverables and verified resources.</text>
  </g>

  <!-- Left Main Card: 8-Week Step-by-Step Curriculum -->
  <g transform="translate(60, 200)">
    <rect width="530" height="530" rx="16" fill="url(#cardGrad2)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" />
    
    <text x="30" y="45" fill="#ffffff" font-size="20" font-weight="700" class="font-sans">Personalized Execution Curriculum</text>
    <text x="30" y="70" fill="#38bdf8" font-size="13" class="font-mono">FULL-STACK DEVELOPER · 8-WEEK TRACK</text>

    <!-- Weekly Modules -->
    <g transform="translate(30, 95)">
      <!-- Week 1 (Completed) -->
      <g transform="translate(0, 0)">
        <rect width="470" height="88" rx="12" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="1" />
        <circle cx="35" cy="44" r="16" fill="rgba(16, 185, 129, 0.2)" />
        <text x="28" y="50" fill="#10b981" font-size="16" font-weight="800" class="font-mono">✓</text>
        
        <text x="68" y="32" fill="#ffffff" font-size="15" font-weight="700" class="font-sans">Week 1: Modern JS &amp; Async Architecture</text>
        <text x="68" y="52" fill="#94a3b8" font-size="12" class="font-sans">Mastered closures, promises, DOM events, and modular ES6 patterns.</text>
        
        <!-- Deliverable Tag -->
        <rect x="68" y="60" width="130" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" />
        <text x="75" y="74" fill="#34d399" font-size="10" font-weight="700" class="font-mono">PROJECT DELIVERED</text>
        
        <text x="420" y="48" fill="#10b981" font-size="12" font-weight="700" class="font-mono">100%</text>
      </g>

      <!-- Week 2 (Active In Progress) -->
      <g transform="translate(0, 100)">
        <rect width="470" height="88" rx="12" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-width="1.5" />
        <circle cx="35" cy="44" r="16" fill="rgba(0, 242, 254, 0.25)" />
        <circle cx="35" cy="44" r="6" fill="#00f2fe" />
        
        <text x="68" y="32" fill="#ffffff" font-size="15" font-weight="700" class="font-sans">Week 2: RESTful Express &amp; JWT Security</text>
        <text x="68" y="52" fill="#94a3b8" font-size="12" class="font-sans">Building authenticated CRUD endpoints, rate limiting, and input validation.</text>
        
        <!-- Active Tag -->
        <rect x="68" y="60" width="115" height="20" rx="4" fill="rgba(0, 242, 254, 0.25)" />
        <text x="75" y="74" fill="#38bdf8" font-size="10" font-weight="700" class="font-mono">ACTIVE MODULE</text>

        <text x="425" y="48" fill="#00f2fe" font-size="12" font-weight="700" class="font-mono">75%</text>
      </g>

      <!-- Week 3 (Upcoming) -->
      <g transform="translate(0, 200)">
        <rect width="470" height="88" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" />
        <circle cx="35" cy="44" r="16" fill="rgba(255, 255, 255, 0.05)" />
        <text x="31" y="49" fill="#94a3b8" font-size="14" font-weight="700" class="font-mono">3</text>
        
        <text x="68" y="32" fill="#e2e8f0" font-size="15" font-weight="700" class="font-sans">Week 3: Database Persistence (MongoDB Atlas)</text>
        <text x="68" y="52" fill="#94a3b8" font-size="12" class="font-sans">Schema modeling, indexing, aggregation pipelines, and ACID transactions.</text>
        
        <rect x="68" y="60" width="85" height="20" rx="4" fill="rgba(255, 255, 255, 0.07)" />
        <text x="75" y="74" fill="#94a3b8" font-size="10" font-weight="700" class="font-mono">UPCOMING</text>
        
        <text x="430" y="48" fill="#64748b" font-size="12" font-weight="700" class="font-mono">0%</text>
      </g>

      <!-- Week 4 (Upcoming) -->
      <g transform="translate(0, 300)">
        <rect width="470" height="88" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" />
        <circle cx="35" cy="44" r="16" fill="rgba(255, 255, 255, 0.05)" />
        <text x="31" y="49" fill="#94a3b8" font-size="14" font-weight="700" class="font-mono">4</text>
        
        <text x="68" y="32" fill="#e2e8f0" font-size="15" font-weight="700" class="font-sans">Week 4: Cloud Deployment &amp; GitHub CI/CD</text>
        <text x="68" y="52" fill="#94a3b8" font-size="12" class="font-sans">Automated testing, Render production build, CORS headers, domain mapping.</text>
        
        <rect x="68" y="60" width="85" height="20" rx="4" fill="rgba(255, 255, 255, 0.07)" />
        <text x="75" y="74" fill="#94a3b8" font-size="10" font-weight="700" class="font-mono">UPCOMING</text>

        <text x="430" y="48" fill="#64748b" font-size="12" font-weight="700" class="font-mono">0%</text>
      </g>
    </g>

    <!-- Bottom Roadmap Progress Meter -->
    <g transform="translate(30, 480)">
      <text x="0" y="15" fill="#94a3b8" font-size="12" class="font-sans">Overall Roadmap Completion</text>
      <text x="470" y="15" fill="#00f2fe" font-size="12" font-weight="700" text-anchor="end" class="font-mono">45% Complete</text>
      <rect y="25" width="470" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
      <rect y="25" width="211" height="8" rx="4" fill="url(#neonCyanBlue)" />
    </g>
  </g>

  <!-- Right Side Card: Calibrated Match Score & Career Atlas Telemetry -->
  <g transform="translate(630, 200)">
    <rect width="510" height="530" rx="16" fill="url(#cardGrad2)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.5" />
    
    <text x="35" y="45" fill="#ffffff" font-size="20" font-weight="700" class="font-sans">Calibrated Career Atlas Score</text>
    
    <!-- Score Dial Box -->
    <g transform="translate(35, 75)">
      <rect width="440" height="150" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(0, 242, 254, 0.3)" />
      
      <circle cx="85" cy="75" r="50" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10" />
      <circle cx="85" cy="75" r="50" fill="none" stroke="#00f2fe" stroke-width="10" stroke-dasharray="314" stroke-dashoffset="38" stroke-linecap="round" />
      <text x="85" y="83" fill="#00f2fe" font-size="26" font-weight="800" text-anchor="middle" class="font-sans">88%</text>
      
      <text x="160" y="55" fill="#ffffff" font-size="17" font-weight="700" class="font-sans">Full-Stack Developer</text>
      <text x="160" y="80" fill="#94a3b8" font-size="13" class="font-sans">Calculated via deterministic weighted matching: 60% skills + 25% interests + 15% academics.</text>
      
      <rect x="160" y="98" width="145" height="26" rx="6" fill="#10b981" opacity="0.2" />
      <text x="170" y="115" fill="#6ee7b7" font-size="11" font-weight="700" class="font-mono">STATUS: OPTIMAL FIT</text>
    </g>

    <!-- Placement Readiness Index (PRI) -->
    <g transform="translate(35, 255)">
      <text x="0" y="20" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">Placement Readiness Index (PRI):</text>
      
      <rect x="0" y="35" width="440" height="90" rx="10" fill="rgba(0, 242, 254, 0.05)" stroke="rgba(0, 242, 254, 0.2)" />
      <text x="20" y="65" fill="#e2e8f0" font-size="14" font-weight="700" class="font-sans">🎯 92 / 100 — High Employability Target</text>
      <text x="20" y="88" fill="#94a3b8" font-size="12" class="font-sans">Every milestone is paired with verified documentation (MDN, Node docs, MongoDB University).</text>
      <text x="20" y="108" fill="#38bdf8" font-size="12" font-weight="600" class="font-sans">Deliverable: Deployable production portfolio repository.</text>
    </g>

    <!-- AI Career Mentor Integration -->
    <g transform="translate(35, 385)">
      <rect width="440" height="85" rx="10" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.3)" />
      <circle cx="35" cy="42" r="16" fill="rgba(139, 92, 246, 0.25)" />
      <text x="27" y="47" fill="#a78bfa" font-size="16">🤖</text>
      <text x="65" y="36" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">24/7 AI Mentor Contextual Guidance</text>
      <text x="65" y="56" fill="#94a3b8" font-size="12" class="font-sans">Doubts solved instantly within your active roadmap module with code suggestions and concept breakdowns.</text>
    </g>

    <!-- Bottom Status -->
    <g transform="translate(35, 495)">
      <text x="0" y="15" fill="#10b981" font-size="13" font-weight="600" class="font-mono">✓ CLEAR PATHWAY · MEASURABLE PROGRESSION</text>
    </g>
  </g>
</svg>
