    <circle cx="16" cy="15" r="4.5" fill="#4F46E5" />
    <text x="28" y="19.5" fill="#4338CA" font-size="11.5" font-weight="700" letter-spacing="0.8" class="font-mono">STAGE 2 : REVEALED ROADMAP</text>

