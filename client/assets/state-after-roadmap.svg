        <path d="M25 29h6m-6 4h4" stroke="#059669" stroke-width="1.8" stroke-linecap="round" />
        <text x="54" y="27" fill="#0F172A" font-size="13.5" font-weight="700" class="font-sans">Curated Docs &amp; Industry Standards</text>
        <text x="54" y="46" fill="#475569" font-size="11.5" class="font-sans">Canonical docs from MDN, Node.js, MongoDB, and more.</text>
