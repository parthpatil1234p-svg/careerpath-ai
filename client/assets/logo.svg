<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark Obsidian) -->
    <linearGradient id="userLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="100%" stop-color="#020308" />
    </linearGradient>

    <!-- Ring Gradient (Cyan to Purple/Violet) -->
    <linearGradient id="userRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Node Trail Gradient -->
    <linearGradient id="userTrailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Arrow Left Facet Gradient -->
    <linearGradient id="arrowLeftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Arrow Right Facet Gradient -->
    <linearGradient id="arrowRightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Icon Background Tile -->
  <rect x="6" y="6" width="188" height="188" rx="46" fill="url(#userLogoBg)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5" />

  <!-- Outer Broken Orbital Ring -->
  <!-- Top-Left Segment -->
  <path d="M 112 30 A 70 70 0 0 0 52 144" fill="none" stroke="url(#userRingGrad)" stroke-width="7.5" stroke-linecap="round" filter="url(#neonBloom)" />
  <!-- Bottom-Right Segment -->
  <path d="M 68 158 A 70 70 0 0 0 148 76" fill="none" stroke="url(#userRingGrad)" stroke-width="7.5" stroke-linecap="round" filter="url(#neonBloom)" />

  <!-- Sweeping Milestone Trail Arc -->
  <path d="M 48 132 C 64 96, 96 66, 150 36" fill="none" stroke="url(#userTrailGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonBloom)" />

  <!-- 3 Stepping-Stone Milestone Nodes -->
  <!-- Node 1: Bottom-Left (Cyan) -->
  <circle cx="48" cy="132" r="8" fill="#00F2FE" filter="url(#dotGlow)" />
  <circle cx="48" cy="132" r="4.5" fill="#FFFFFF" />

  <!-- Node 2: Center-Left (Blue) -->
  <circle cx="94" cy="86" r="7.5" fill="#3B82F6" filter="url(#dotGlow)" />
  <circle cx="94" cy="86" r="4" fill="#93C5FD" />

  <!-- Node 3: Top-Right (Purple) -->
  <circle cx="150" cy="36" r="8" fill="#A855F7" filter="url(#dotGlow)" />
  <circle cx="150" cy="36" r="4.5" fill="#F3E8FF" />

  <!-- Central Dynamic Arrowhead (Northeast 45° Trajectory) -->
  <g filter="url(#neonBloom)">
    <!-- Main Arrow Body (Chevron / Dart) -->
    <path d="M 162 42 L 78 116 L 112 104 L 126 142 Z" fill="url(#arrowLeftGrad)" />
    <!-- Secondary Right Facet for Dimensionality -->
    <path d="M 162 42 L 112 104 L 126 142 Z" fill="url(#arrowRightGrad)" opacity="0.92" />
  </g>
</svg>
