<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Primary Brand Gradient (Indigo to Royal Blue to Cyan) -->
    <linearGradient id="uiPrimaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Facet Light Accent -->
    <linearGradient id="uiFacetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Needle South Muted Slate Gradient -->
    <linearGradient id="uiSouthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Contrast on Light UI -->
    <filter id="uiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Transparent Background - Fits Any Surface -->

  <!-- Outer Orbital Navigation Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#C7D2FE" stroke-width="1.8" stroke-dasharray="3 3.5" opacity="0.85" />
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="#E2E8F0" stroke-width="1" />

  <!-- Cardinal Compass Tick Marks -->
  <line x1="50" y1="4" x2="50" y2="10" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
  <line x1="96" y1="50" x2="90" y2="50" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="96" x2="50" y2="90" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <line x1="4" y1="50" x2="10" y2="50" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

  <!-- Upward Learning Pathway (Curved Roadmap Trail) -->
  <path d="M 22 75 C 28 52, 48 36, 78 22" fill="none" stroke="url(#uiPrimaryGrad)" stroke-width="2.2" stroke-dasharray="3.5 3.5" stroke-linecap="round" opacity="0.6" />

  <!-- Roadmap Milestone Nodes -->
  <circle cx="22" cy="75" r="3.2" fill="#94A3B8" />
  <circle cx="36" cy="58" r="3.6" fill="#6366F1" />
  <circle cx="54" cy="42" r="4" fill="#2563EB" />
  <circle cx="78" cy="22" r="4.5" fill="#06B6D4" />

  <!-- 45-Degree Upward Career Compass Arrow Needle -->
  <g transform="rotate(45, 50, 50)" filter="url(#uiShadow)">
    <!-- North Pointer Main Blade (Vibrant Indigo to Blue) -->
    <polygon points="50,11 60,50 50,44 50,11" fill="url(#uiPrimaryGrad)" />
    <!-- North Pointer Left Facet (Cyan/Sky Highlight) -->
    <polygon points="50,11 40,50 50,44 50,11" fill="url(#uiFacetGrad)" />

    <!-- East/West Stabilizer Wings -->
    <polygon points="60,50 74,50 50,55 50,44" fill="#4F46E5" opacity="0.9" />
    <polygon points="40,50 26,50 50,55 50,44" fill="#3B82F6" opacity="0.85" />

    <!-- South Pointer (Slate) -->
    <polygon points="50,89 40,50 50,56 50,89" fill="url(#uiSouthGrad)" />
    <polygon points="50,89 60,50 50,56 50,89" fill="#64748B" />
  </g>

  <!-- Radiant Career Apex Spark at Arrow Tip (x=77.5, y=22.5) -->
  <g transform="translate(77.5, 22.5)">
    <line x1="0" y1="-6.5" x2="0" y2="6.5" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
    <line x1="-6.5" y1="0" x2="6.5" y2="0" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1" />
  </g>

  <!-- Center Core Pivot Bearing (Crisp White + Indigo Ring) -->
  <circle cx="50" cy="50" r="9" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2.5" />
  <circle cx="50" cy="50" r="5" fill="#EEF2FF" />
  <circle cx="50" cy="50" r="3" fill="#4F46E5" />
</svg>
