<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brand Primary Gradient -->
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Compass Needle Accent -->
    <linearGradient id="favNeedleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBgGrad)" />

  <!-- Subtle Dial Ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- Cardinal Tick Marks -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" />
  <line x1="58" y1="32" x2="54" y2="32" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="58" x2="32" y2="54" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="6" y1="32" x2="10" y2="32" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" stroke-linecap="round" />

  <!-- 45-degree Forward Needle -->
  <g transform="rotate(45, 32, 32)">
    <polygon points="32,8 38,32 32,28 32,8" fill="url(#favNeedleGrad)" />
    <polygon points="32,8 26,32 32,28 32,8" fill="#FFFFFF" opacity="0.9" />
    <polygon points="32,56 26,32 32,36 32,56" fill="rgba(15, 23, 42, 0.5)" />
    <polygon points="32,56 38,32 32,36 32,56" fill="rgba(15, 23, 42, 0.3)" />
  </g>

  <!-- Center Core Pivot -->
  <circle cx="32" cy="32" r="5" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="2.5" fill="#4F46E5" />

  <!-- Apex Sparkle at Arrow Tip -->
  <circle cx="49" cy="15" r="2" fill="#00F2FE" />
</svg>
