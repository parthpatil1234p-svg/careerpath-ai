<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="100%" stop-color="#020308" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="favRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="favArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#favBgGrad)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.2" />

  <!-- Broken Ring -->
  <path d="M 36 10 A 22 22 0 0 0 17 46" fill="none" stroke="url(#favRingGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 21 50 A 22 22 0 0 0 47 24" fill="none" stroke="url(#favRingGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Sweeping Milestone Trail -->
  <path d="M 16 42 C 21 30, 31 21, 48 11" fill="none" stroke="url(#favRingGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

  <!-- 3 Milestone Nodes -->
  <circle cx="16" cy="42" r="2.8" fill="#00F2FE" />
  <circle cx="31" cy="27" r="2.5" fill="#3B82F6" />
  <circle cx="48" cy="11" r="2.8" fill="#A855F7" />

  <!-- Dynamic Arrow Dart -->
  <path d="M 52 14 L 25 37 L 36 34 L 40 46 Z" fill="url(#favArrowGrad)" />
</svg>
